<table
  mat-table
  [fixedLayout]="true"
  multiTemplateDataRows
  [dataSource]="resource.value() ?? []"
  [trackBy]="trackByPostId"
  matSort
  matSortDisableClear
  [matSortActive]="sortBy()"
  [matSortDirection]="sortDirection()"
  (matSortChange)="onSortChange($event)"
>
  <colgroup>
    <col width="120" />
    <col width="auto" />
    <col width="50" />
    <col width="50" />
  </colgroup>

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>{{ 'table.posts.id.title' | transloco }}</th>
    <td mat-cell *matCellDef="let row">{{ '#' + row.id }}</td>
  </ng-container>

  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>{{ 'table.posts.title.title' | transloco }}</th>
    <td mat-cell *matCellDef="let row" class="font-bold">{{ row.title }}</td>
  </ng-container>

  <ng-container matColumnDef="body">
    <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>{{ 'table.posts.body.title' | transloco }}</th>
    <td mat-cell *matCellDef="let row">{{ row.body }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>&nbsp;</th>
    <td mat-cell *matCellDef="let row">todo</td>
  </ng-container>

  <ng-container matColumnDef="expand">
    <th mat-header-cell *matHeaderCellDef [attr.aria-label]="'uni.aria-label.row-actions' | transloco">&nbsp;</th>
    <td mat-cell *matCellDef="let element">todo</td>
  </ng-container>

  <ng-container matColumnDef="expandedDetail">
    <td mat-cell *matCellDef="let element" [attr.colspan]="displayedColumnsExpanded.length">todo</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumnsExpanded"></tr>

  <tr mat-row *matRowDef="let row; columns: displayedColumnsExpanded"></tr>

  <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="h-0"></tr>
</table>

<mat-paginator
  [pageSizeOptions]="pageSizeOptions"
  [pageSize]="pageSize()"
  [pageIndex]="pageIndex() - 1"
  [length]="totalCount()"
  (page)="onPageChange($event)"
  [attr.aria-label]="'uni.aria-label.select-page-of-posts' | transloco"
/>
