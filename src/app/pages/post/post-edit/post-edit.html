<form (submit)="onSubmit($event)" (reset)="onReset($event)">
  <mat-card>
    <mat-card-content>
      <mat-form-field class="w-full">
        <mat-label>{{ 'form.post.title.label' | transloco }}</mat-label>
        <input matInput type="text" [field]="form.title" />
        @if (form.title().value()) {
          <app-clear-suffix matSuffix />
        }
      </mat-form-field>

      <mat-form-field class="w-full">
        <mat-label>{{ 'form.post.body.label' | transloco }}</mat-label>
        <textarea
          matInput
          cdkTextareaAutosize
          #autosize="cdkTextareaAutosize"
          [placeholder]="'form.post.body.placeholder' | transloco"
          [field]="form.body"
        ></textarea>
      </mat-form-field>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-button type="reset" [disabled]="isProcessing()">
        <mat-icon>restore</mat-icon>
        {{ 'uni.reset' | transloco }}
      </button>
      <button mat-button type="submit" [disabled]="isProcessing()">
        <app-text-progress [isProgressing]="isSaving()" [type]="'save'" />
      </button>
      <button mat-button type="button" [disabled]="isProcessing()" (click)="onDelete()">
        <app-text-progress [isProgressing]="isDeleting()" [type]="'delete'" />
      </button>
    </mat-card-actions>
  </mat-card>
</form>
