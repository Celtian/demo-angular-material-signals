<form (submit)="onSubmit($event)">
  <mat-card>
    <mat-card-content>
      <mat-form-field class="w-full">
        <mat-label>{{ 'form.post.title.label' | transloco }}</mat-label>
        <input matInput type="text" [field]="form.title" />
      </mat-form-field>

      <mat-form-field class="w-full">
        <mat-label>{{ 'form.post.body.label' | transloco }}</mat-label>
        <textarea
          matInput
          cdkTextareaAutosize
          #autosize="cdkTextareaAutosize"
          [placeholder]="'form.post.body.placeholder' | transloco"
          [field]="form.content"
        ></textarea>
      </mat-form-field>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-button type="reset">{{ 'uni.reset' | transloco }}</button>
      <button mat-button type="submit">{{ 'uni.submit' | transloco }}</button>
    </mat-card-actions>
  </mat-card>
</form>
