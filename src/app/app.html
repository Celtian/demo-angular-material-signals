<header class="sticky top-0 z-10">
  <mat-toolbar color="primary" role="navigation">
    <nav class="container m-auto flex items-center justify-between gap-2">
      <a mat-button [routerLink]="['/']">Signals Demo</a>

      <div class="flex gap-2">
        <app-theme />
        <button mat-button (click)="toggleLanguage()" class="uppercase">{{ lang() }}</button>
      </div>
    </nav>
  </mat-toolbar>
</header>

<main class="flex-1 permanent-main">
  <mat-toolbar>
    <div class="container m-auto text-sm">
      <xng-breadcrumb [separator]="separatorTemplate" [preserveQueryParams]="false" [preserveFragment]="false">
        <ng-container *xngBreadcrumbItem="let breadcrumb; let info = info">
          @if (info?.translate) {
            {{ breadcrumb | transloco }}
          } @else {
            {{ breadcrumb }}
          }
        </ng-container>
      </xng-breadcrumb>
      <ng-template #separatorTemplate>
        <mat-icon>chevron_right</mat-icon>
      </ng-template>
    </div>
  </mat-toolbar>

  <router-outlet />
</main>

<footer ngxFixedFooter class="fixed bottom-0 w-full text-center">
  <mat-toolbar color="primary">
    <div class="container m-auto text-sm">{{ 'footer.content' | transloco: { endYear } }}</div>
  </mat-toolbar>
</footer>
